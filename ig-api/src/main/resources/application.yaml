spring:
  profiles:
    active: dev
  application:
    name: ig-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${ig.postgres.host:localhost}:${ig.postgres.port:5432}/${ig.postgres.database:interview_guide}
    username: ${ig.postgres.username:postgres}
    password: ${ig.postgres.password:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  redis:
    redisson:
      config:
        singleServerConfig:
          address: "redis://${ig.redis.host:localhost}:${ig.redis.port:6379}"
          database: 0

app:
  storage:
    endpoint: ${ig.app.storage.endpoint:http://localhost:9000}
    access-key: ${ig.app.storage.access-key:minioadmin}
    secret-key: ${ig.app.storage.secret-key:minioadmin}
    bucket: ${ig.app.storage.bucket:interview-guide}
    region: ${ig.app.storage.region:us-east-1}
    auto-create-bucket: true
